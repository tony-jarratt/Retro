<!doctype html><meta charset="utf-8"><style>body{margin:0;background:#000}</style>
<canvas id="game" width="1024" height="688"></canvas>
<script src="../js/data.js"></script><script src="../js/rules.js"></script><script src="../js/sprites.js"></script>
<script src="../js/audio.js"></script><script src="../js/music.js"></script><script src="../js/render.js"></script>
<script src="../js/ui.js"></script><script src="../js/main.js"></script>
<script>
// Builds a screen for screenshots: shot.html?norun&scene=title|help|brief|room|win|lose&room=observatory&page=0
const q = new URLSearchParams(location.search);
const scene = q.get('scene') || 'title';
app.tick = 100;
if (scene === 'title') app.mode = 'title';
else if (scene === 'help') { app.mode = 'help'; app.help.page = Number(q.get('page') || 0); }
else if (scene === 'brief') app.mode = 'brief';
else {
  startGame();
  const g = app.game;
  const idx = ROOM_INDEX[q.get('room') || 'airlock'];
  g.hero.room = idx; g.seen.add(idx);
  const room = cur(g);
  const e = Object.entries(room.spec.exits)[0]; const [ex, ey] = exitTile(room.spec, e[0], e[1]);
  g.hero.x = Number(q.get('x') ?? ex); g.hero.y = Number(q.get('y') ?? ey); g.hero.entry = { x: g.hero.x, y: g.hero.y };
  if (q.has('carry')) g.hero.carry = q.get('carry').split(',');
  if (q.has('delivered')) g.delivered = q.get('delivered').split(',');
  g.events.length = 0; snapHero(g);
  say(room.spec.caption, 9999);
  if (scene === 'win') { g.over = 'win'; g.delivered = PARTS.map((p) => p.id); app.mode = 'win'; app.endTimer = Number(q.get('t') || 200); app.newBest = true; }
  else if (scene === 'lose') { g.over = 'lose'; g.time = 0; g.delivered = ['nose', 'fins']; app.mode = 'lose'; app.endTimer = 200; }
  g.elapsed = Number(q.get('elapsed') || 0);
}
for (let i = 0; i < 20; i++) stepGame(1 / 60);
render();
</script>
