<script>
  // Runs every check and puts the result in the page title ("DONE checks=N passed=N failures=N"), which
  // run-checks.sh reads. Add ?nobalance to skip the balance report.
  const out = document.getElementById('out');
  const text = [];
  try {
    const result = runAllChecks(line => text.push(line), !location.search.includes('nobalance'));
    out.textContent = text.join('\n');
    document.title = result.lines[result.lines.length - 1];
  } catch (e) {
    out.textContent = text.join('\n') + '\nCHECK RUNNER CRASHED: ' + (e && e.stack ? e.stack : e);
    document.title = 'DONE checks=0 passed=0 failures=1 (the runner crashed)';
  }
</script>
