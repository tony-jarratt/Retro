<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hexfire scroll mockup</title>
<style>
  html, body { margin: 0; height: 100%; background: #050b1e; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  canvas { width: min(100vw, calc(100vh * 1024 / 688)); height: auto; aspect-ratio: 1024 / 688; display: block; user-select: none; cursor: grab; touch-action: none; }
  canvas.dragging { cursor: grabbing; }
</style>
</head>
<body>
<canvas id="c" width="1024" height="688"></canvas>
<!-- the game's own files: the hexes, terrain art and mech sprites are exactly the in-game size. Nothing here changes the game. -->
<script src="../js/errors.js"></script>
<script src="../js/rng.js"></script>
<script src="../js/data.js"></script>
<script src="../js/map.js"></script>
<script src="../js/scenarios.js"></script>
<script src="../js/objectives.js"></script>
<script src="../js/rules.js"></script>
<script src="../js/sprites.js"></script>
<script src="../js/effects.js"></script>
<script src="../js/render.js"></script>
<script src="scroll-map.js"></script>
</body>
</html>
