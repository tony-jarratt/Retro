<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raycaster</title>
<style>
  body {
    margin: 0;
    background: #111;
    color: #888;
    font: 13px monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  #wrap { position: relative; margin-top: 16px; }
  /* The canvas is 320x200 real pixels. CSS draws it 3x bigger, and
     "pixelated" means each pixel becomes a crisp block instead of a blur. */
  #screen {
    display: block;
    width: min(960px, 100vw);
    aspect-ratio: 320 / 200;
    image-rendering: pixelated;
    cursor: crosshair;
  }
  #debug { position: absolute; left: 8px; top: 8px; display: none; }
  /* The play-test level chooser (index.html?playtest), drawn over the screen
     in the HUD's green phosphor. */
  #chooser {
    position: absolute; inset: 0; display: none;
    flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: #050805; color: #78ff96; font: 20px monospace; letter-spacing: 2px;
  }
  #chooser h1 { font-size: 26px; margin: 0 0 10px; font-weight: normal; }
  #chooser button {
    font: inherit; color: inherit; background: none; cursor: pointer;
    border: 2px solid #2c6b3a; padding: 8px 28px; min-width: 60%;
  }
  #chooser button:hover, #chooser button:focus { border-color: #78ff96; background: #0d1f10; outline: none; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="screen"></canvas>
  <canvas id="debug"></canvas>
  <div id="chooser"><h1>PLAY-TEST: CHOOSE A LEVEL</h1></div>
</div>

<!-- Plain scripts, not ES modules: browsers refuse to load modules from
     file:// URLs, and we want "just open index.html" to work. Classic scripts
     share one global scope, so order matters: each file may only use names
     defined by the files above it (at load time). -->
<script src="legend.js"></script>
<!-- The levels, in the order you play them. Each adds itself to LEVELS. -->

</body>
</html>
