<canvas id="game" width="1024" height="688"></canvas>
<script src="../js/levels.js"></script><script src="../js/audio.js"></script><script src="../js/music.js"></script><script src="../js/player.js"></script>
<script src="../js/enemies.js"></script><script src="../js/obstacles.js"></script><script src="../js/render.js"></script><script src="../js/main.js"></script>
<script>
const q = new URLSearchParams(location.search);
startLevel(Number(q.get('lv'))); setMode('play'); G.enemies = []; G.spawners = []; G.winTimer = 99999;
const w = Number(q.get('w') || 0);
G.winEvents.push({ win: w, type: q.get('type') || 'owl', t: Number(q.get('t') || 100), dur: q.get('type') === 'star' ? 200 : 280, dx: -24, sy: 0.27 });
step(); G.winEvents[0].t = Number(q.get('t') || 100); G.paused = true;
</script>
